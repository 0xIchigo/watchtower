name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        shell: bash
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # Scans only the commits a push or pull request adds; existing history is not rechecked.
      - name: Scan new commits
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            log_opts="${PR_HEAD} --not origin/${BASE_REF}"
          elif [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            log_opts="-1 ${PUSH_AFTER}"
          else
            log_opts="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          if ! "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$log_opts" .; then
            cat >&2 <<'EOF'
          ::error::gitleaks found a secret in the commits above.
          Real secret: rotate it. Deleting it in a later commit leaves it in the branch history.
          False positive: add a "gitleaks:allow" comment on that line, or add the Fingerprint to .gitleaksignore.
          EOF
            exit 1
          fi

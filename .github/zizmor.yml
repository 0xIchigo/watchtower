# Config for zizmor (run by .github/workflows/zizmor.yml). https://docs.zizmor.sh/configuration/
rules:
  unpinned-uses:
    config:
      policies:
        # First-party GitHub actions may pin to a tag; every other action must pin to a full commit SHA.
        actions/*: ref-pin
        github/*: ref-pin
        dependabot/*: ref-pin
        '*': hash-pin
